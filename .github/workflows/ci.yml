name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env: { GIGBID_FAKE_LLM: "1", GIGSIM_CLIENT_LLM: "0", GIGSIM_ERROR_RATE: "0", PYTHONPATH: "." }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv && uv pip install --system -e ".[dev]"
      - name: lint + repository rules (no secrets, gigsim unchanged, prompts in agent/prompts, README numbers traced)
        run: ruff check agent rag mcp_servers apps worker gigsim evals scripts --select E9,F63,F7,F82 && python scripts/ci_checks.py
      - name: unit + contract (MCP schema snapshots)
        run: pytest tests/unit tests/contract -q
      - name: integration (graph against GigSim)
        run: pytest tests/integration -q
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Playwright e2e
        run: |
          cd apps/web && npm ci && npx vite build && npx playwright install --with-deps chromium
          cd ../.. && (PORT=8000 python -m apps.api.allinone > server.log 2>&1 &) && sleep 25
          cd apps/web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report }
