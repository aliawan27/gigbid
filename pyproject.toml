[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "pyyaml==6.0.2",
  "httpx==0.28.1",
  "python-dotenv==1.1.0",
  "sqlalchemy==2.0.40",
  "langgraph==0.4.8",
  "langgraph-checkpoint-sqlite==2.0.10",
  "langgraph-checkpoint-postgres==2.0.21",
  "psycopg[binary,pool]==3.2.9",
  "langchain-core==0.3.63",
  "langchain-groq==0.3.2",
  "langgraph-supervisor==0.0.27",
  "langchain-mcp-adapters==0.1.7",
  "mcp==1.9.4",
  "fastembed==0.7.1",
  "rank-bm25==0.2.2",
  "numpy==2.2.6",
  "langsmith==0.3.45",
  "pypdf==5.6.0",
  "cryptography==45.0.3",
  "aiosqlite==0.20.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.12"]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_servers", "rag", "agent"]

[tool.hatch.build.targets.wheel.force-include]
"data/personas" = "gigbid_data/personas"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
